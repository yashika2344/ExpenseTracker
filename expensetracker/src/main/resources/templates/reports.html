<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .report-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .total {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Expense Reports</h1>
        
        <div class="report-section">
            <h2>Weekly Expense Report</h2>
            <p>Period: <span th:text="${weekStart}"></span> to <span th:text="${weekEnd}"></span></p>
            
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="expense : ${weeklyExpenses}">
                        <td th:text="${expense.date}"></td>
                        <td th:text="${expense.description}"></td>
                        <td th:text="${expense.amount}"></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="total">
                Total Expenses for the Week: ₹<span th:text="${weeklyTotal}"></span>
            </div>
        </div>
        
        <a href="/expenses" class="back-link">← Back to Expenses</a>
    </div>
</body>
</html>
