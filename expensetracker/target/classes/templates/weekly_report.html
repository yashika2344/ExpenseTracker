<!-- In weekly_report.html -->
<h1>Weekly Expense Report</h1>
<table>
    <thead>
        <tr>
            <th>Category</th>
            <th>Total Amount</th>
        </tr>
    </thead>
    <tbody>
        <th:block th:each="entry : ${categoryTotals}">
            <tr>
                <td th:text="${entry.key}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
        </th:block>
    </tbody>
</table>
<p>Total Expense for the week: <span th:text="${totalExpense}"></span></p>
