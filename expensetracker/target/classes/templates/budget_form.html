<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Weekly Budget</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .btn-back a {
            text-decoration: none;
            color: #6c757d;
        }

        .btn-back a:hover {
            color: #5a6268;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 0.375rem;
        }

        .form-label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Set or Update Weekly Budget</h2>

    <form th:action="@{/budget/save}" th:object="${budget}" method="post">
        <!-- Hidden field to retain ID for update -->
        <input type="hidden" th:field="*{id}" />

        <!-- Budget Category Field -->
        <div class="form-group">
            <label for="category" class="form-label">Budget Category:</label>
            <input type="text" id="category" th:field="*{category}" class="form-control" required />
        </div>

        <!-- Limit Amount Field -->
        <div class="form-group">
            <label for="limitAmount" class="form-label">Limit Amount (₹):</label>
            <input type="number" id="limitAmount" th:field="*{limitAmount}" class="form-control" step="0.01" required />
        </div>

        <!-- Save Button -->
        <button type="submit" class="btn btn-primary w-100">Save Budget</button>
    </form>

    <!-- Back Button -->
    <div class="btn-back">
        <a href="/expenses">← Back to Expenses</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
