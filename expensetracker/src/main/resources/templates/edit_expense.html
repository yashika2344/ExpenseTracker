<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <!-- Include Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .btn-back a {
            text-decoration: none;
            color: #6c757d;
        }

        .btn-back a:hover {
            color: #5a6268;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 0.375rem;
        }

        .form-label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Expense</h2>

    <form th:action="@{/expenses/update}" th:object="${expense}" method="post">
        <!-- Hidden field to retain ID for update -->
        <input type="hidden" th:field="*{id}" />

        <!-- Description Field -->
        <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <input type="text" id="description" th:field="*{description}" class="form-control" required />
        </div>

        <!-- Amount Field -->
        <div class="form-group">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" id="amount" th:field="*{amount}" class="form-control" step="0.01" required />
        </div>

        <!-- Date Field -->
        <div class="form-group">
            <label for="date" class="form-label">Date</label>
            <input type="date" id="date" th:field="*{date}" class="form-control" required />
        </div>

        <!-- Update Button -->
        <button type="submit" class="btn btn-primary">Update</button>
    </form>

    <!-- Back Button -->
    <div class="btn-back">
        <a href="/expenses">← Back to Expenses</a>
    </div>
</div>

<!-- Include Bootstrap JS for interactivity -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
