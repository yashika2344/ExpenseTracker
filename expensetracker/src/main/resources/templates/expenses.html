<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Application</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styling for the sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 250px;
            background-color: #343a40;
            padding-top: 30px;
            padding-left: 10px;
        }

        .sidebar a {
            color: white;
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            display: block;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        /* Button styling */
        .btn {
            padding: 10px 14px;
            margin: 4px;
            font-size: 12px;
            text-align: center;
            background-color: #574caf;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #45a049;
        }

        /* Table styling */
        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        /* Custom layout for the Welcome Text */
        .welcome-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Budget Alert Section */
        .budget-alert {
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/dashboard">Dashboard</a>
        <a href="/expenses/add" class="btn">➕ Add Expense</a>
        <a href="/budget" class="btn">➕ Set/Update Budget</a>
        <a href="/reports" class="btn">📊 View Reports</a>
        <a href="/logout" class="btn">🚪 Logout</a> <!-- Added logout link -->
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Updated Heading -->
            <h2 class="welcome-title">Welcome to Expense Tracker Application</h2>

            <!-- ✅ Budget Alert Section -->
            <div th:if="${budgetExceeded}" class="budget-alert" style="color: red;">
                ⚠️ Weekly budget exceeded! You spent ₹<span th:text="${totalSpent}"></span> out of ₹<span th:text="${weeklyBudget}"></span>.
            </div>
            <div th:if="${!budgetExceeded}" class="budget-alert" style="color: green;">
                ✅ You're within the weekly budget! ₹<span th:text="${totalSpent}"></span> spent out of ₹<span th:text="${weeklyBudget}"></span>.
            </div>

            <!-- ✅ Expense Table -->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iterate over expenses and display each expense in a row -->
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${expense.id}"></td>
                        <td th:text="${expense.description}"></td>
                        <td th:text="${expense.amount}"></td>
                        <td th:text="${expense.date}"></td>
                        <td>
                            <!-- Edit and Delete Links -->
                            <a th:href="@{'/expenses/edit/' + ${expense.id}}">Edit</a> |
                            <a th:href="@{'/expenses/delete/' + ${expense.id}}">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Include Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
